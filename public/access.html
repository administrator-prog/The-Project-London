<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f6f4ef" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>The Project London</title>

    <!--
      Deliberately standalone: no /assets/* imports, because the middleware
      gates those. Everything this page needs is inline or on the CDN.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500&family=Inter:wght@300;400&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #0a0a0a;
        --bone: #f6f4ef;
        --ash: #9a958c;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        background: var(--bone);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
        font-weight: 300;
        -webkit-font-smoothing: antialiased;
      }
      .panel {
        width: 100%;
        max-width: 28rem;
        text-align: center;
        animation: rise 0.8s var(--ease) both;
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
      }
      .logo {
        height: 3rem;
        width: auto;
      }
      .label {
        margin: 2.5rem 0 0;
        font-family: Archivo, system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.6875rem;
        font-weight: 500;
        color: var(--ash);
      }
      form {
        position: relative;
        display: flex;
        align-items: center;
        margin-top: 1.5rem;
        border-bottom: 1px solid rgba(10, 10, 10, 0.3);
        transition: border-color 0.4s var(--ease);
      }
      form:focus-within {
        border-bottom-color: var(--ink);
      }
      input {
        width: 100%;
        height: 3.5rem;
        padding-right: 3rem;
        border: 0;
        background: transparent;
        text-align: center;
        font: inherit;
        font-size: 1rem;
        color: var(--ink);
      }
      input::placeholder {
        color: var(--ash);
      }
      input:focus {
        outline: none;
      }
      input:disabled {
        opacity: 0.5;
      }
      button {
        position: absolute;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition: transform 0.5s var(--ease);
      }
      button:hover:not(:disabled) {
        transform: translateX(4px);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .message {
        min-height: 1rem;
        margin: 1.25rem 0 0;
        font-size: 0.75rem;
        color: var(--ink);
      }

      /* — Interest list — */
      .signup {
        margin-top: 4rem;
        padding-top: 2.5rem;
        border-top: 1px solid rgba(10, 10, 10, 0.12);
      }
      .signup p.intro {
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        line-height: 1.6;
        color: #6d6a63;
      }
      .fields {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        margin-top: 1.75rem;
      }
      .fields input {
        height: 3rem;
        padding: 0 0.75rem;
        border: 1px solid rgba(10, 10, 10, 0.2);
        background: transparent;
        font-size: 0.9375rem;
        text-align: center;
        transition: border-color 0.4s var(--ease);
      }
      .fields input:focus {
        border-color: var(--ink);
      }
      .signup button {
        position: static;
        width: 100%;
        height: 3rem;
        margin-top: 0.75rem;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--bone);
        font-family: Archivo, system-ui, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        font-size: 0.6875rem;
        font-weight: 500;
        transition:
          letter-spacing 0.5s var(--ease),
          opacity 0.3s var(--ease);
      }
      .signup button:hover:not(:disabled) {
        transform: none;
        letter-spacing: 0.2em;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <img
        class="logo"
        src="https://cdn.estateonline.ai/The%20Project%20London/BLACK%20FONT%20(1).png"
        alt="The Project London"
      />

      <p class="label">By invitation</p>

      <form id="gate">
        <input
          id="password"
          type="password"
          name="password"
          placeholder="Password"
          aria-label="Password"
          autocomplete="current-password"
          required
          autofocus
        />
        <button type="submit" aria-label="Enter">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>

      <p class="message" id="message" role="alert"></p>

      <section class="signup">
        <p class="label">Register interest</p>
        <p class="intro">No password? Leave your details for release dates and first access.</p>

        <form id="signup">
          <div class="fields">
            <input
              id="name"
              type="text"
              name="name"
              placeholder="Full name"
              aria-label="Full name"
              autocomplete="name"
              required
            />
            <input
              id="email"
              type="email"
              name="email"
              placeholder="Email address"
              aria-label="Email address"
              autocomplete="email"
              required
            />
          </div>
          <button type="submit">Notify me</button>
        </form>

        <p class="message" id="signup-message" role="status"></p>
      </section>
    </main>

    <script>
      const form = document.getElementById('gate')
      const input = document.getElementById('password')
      const button = form.querySelector('button')
      const message = document.getElementById('message')

      /** Only same-site relative paths, so ?next= can't bounce people off-site. */
      function safeNext() {
        const value = new URLSearchParams(location.search).get('next')
        return value && /^\/(?!\/)/.test(value) ? value : '/'
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        if (!input.value) return

        input.disabled = true
        button.disabled = true
        message.textContent = ''

        try {
          const response = await fetch('/api/verify-access', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: input.value }),
          })

          if (response.ok) {
            location.replace(safeNext())
            return
          }

          message.textContent =
            response.status === 429
              ? 'Too many attempts. Try again shortly.'
              : response.status === 401
                ? 'Incorrect password.'
                : 'Something went wrong.'
        } catch {
          message.textContent = 'Could not reach the server.'
        }

        input.value = ''
        input.disabled = false
        button.disabled = false
        input.focus()
      })

      // — Interest list —
      const signupForm = document.getElementById('signup')
      const nameField = document.getElementById('name')
      const emailField = document.getElementById('email')
      const signupButton = signupForm.querySelector('button')
      const signupMessage = document.getElementById('signup-message')

      signupForm.addEventListener('submit', async (event) => {
        event.preventDefault()

        signupButton.disabled = true
        signupButton.textContent = 'Sending'
        signupMessage.textContent = ''

        try {
          const response = await fetch('/api/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: nameField.value, email: emailField.value }),
          })

          if (response.ok) {
            signupForm.remove()
            signupMessage.textContent = 'Thank you — we’ll be in touch.'
            return
          }

          signupMessage.textContent =
            response.status === 429
              ? 'Too many attempts. Try again shortly.'
              : response.status === 400
                ? 'Please check your name and email.'
                : 'Something went wrong. Please try again.'
        } catch {
          signupMessage.textContent = 'Could not reach the server.'
        }

        signupButton.disabled = false
        signupButton.textContent = 'Notify me'
      })
    </script>
  </body>
</html>
